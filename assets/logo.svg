<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#8B7CF0"/>
    </linearGradient>
    <linearGradient id="paw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FF9F43"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6C63FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#F5F3FF"/>

  <!-- Subtle ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#6C63FF" stroke-width="1.5" opacity="0.12"/>

  <!-- Minimal dots -->
  <circle cx="80" cy="80" r="3" fill="#6C63FF" opacity="0.2"/>
  <circle cx="320" cy="80" r="3" fill="#6C63FF" opacity="0.2"/>
  <circle cx="80" cy="320" r="3" fill="#6C63FF" opacity="0.2"/>
  <circle cx="320" cy="320" r="3" fill="#6C63FF" opacity="0.2"/>
  <circle cx="200" cy="50" r="3" fill="#FF6B6B" opacity="0.25"/>
  <circle cx="200" cy="350" r="3" fill="#FF6B6B" opacity="0.25"/>
  <circle cx="50" cy="200" r="3" fill="#FF6B6B" opacity="0.25"/>
  <circle cx="350" cy="200" r="3" fill="#FF6B6B" opacity="0.25"/>

  <!-- Roof shape (Cantinho = home) -->
  <path d="M200 90 L100 170 L100 175 L200 105 L300 175 L300 170Z"
        fill="url(#bg)" opacity="0.08"/>

  <!-- Main paw -->
  <g filter="url(#shadow)">
    <!-- Main pad -->
    <path d="M200 240 
             C155 240, 130 205, 130 180 
             C130 155, 148 138, 170 138 
             C185 138, 195 150, 200 162 
             C205 150, 215 138, 230 138 
             C252 138, 270 155, 270 180 
             C270 205, 245 240, 200 240Z"
          fill="url(#paw)"/>

    <!-- Toe pads -->
    <ellipse cx="145" cy="168" rx="17" ry="21" fill="url(#paw)" transform="rotate(-18,145,168)"/>
    <ellipse cx="180" cy="143" rx="15" ry="19" fill="url(#paw)" transform="rotate(-5,180,143)"/>
    <ellipse cx="220" cy="143" rx="15" ry="19" fill="url(#paw)" transform="rotate(5,220,143)"/>
    <ellipse cx="255" cy="168" rx="17" ry="21" fill="url(#paw)" transform="rotate(18,255,168)"/>

    <!-- Highlight dots on paw -->
    <ellipse cx="145" cy="168" rx="5" ry="6" fill="#fff" opacity="0.35"/>
    <ellipse cx="180" cy="143" rx="4" ry="5" fill="#fff" opacity="0.35"/>
    <ellipse cx="220" cy="143" rx="4" ry="5" fill="#fff" opacity="0.35"/>
    <ellipse cx="255" cy="168" rx="5" ry="6" fill="#fff" opacity="0.35"/>
    <circle cx="200" cy="210" r="4" fill="#fff" opacity="0.2"/>
  </g>

  <!-- Tiny heart accent -->
  <path d="M200 280 
           C195 275, 188 268, 188 262 
           C188 257, 192 254, 196 254 
           C198 254, 200 256, 200 258 
           C200 256, 202 254, 204 254 
           C208 254, 212 257, 212 262 
           C212 268, 205 275, 200 280Z"
        fill="url(#accent)" opacity="0.5"/>

  <!-- Text -->
  <text x="200" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="800" fill="#6C63FF" letter-spacing="3">
    CANTINHO
  </text>
  <text x="200" y="365" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#A78BFA" letter-spacing="6">
    PET
  </text>
</svg>
