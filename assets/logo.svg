<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="paw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FF8E53"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6C63FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#F0EEFF"/>

  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#6C63FF" stroke-width="2" stroke-dasharray="8,8" opacity="0.3"/>

  <!-- Small decorative dots -->
  <circle cx="200" cy="30" r="4" fill="#6C63FF" opacity="0.4"/>
  <circle cx="200" cy="370" r="4" fill="#6C63FF" opacity="0.4"/>
  <circle cx="30" cy="200" r="4" fill="#6C63FF" opacity="0.4"/>
  <circle cx="370" cy="200" r="4" fill="#6C63FF" opacity="0.4"/>
  <circle cx="80" cy="80" r="3" fill="#A78BFA" opacity="0.3"/>
  <circle cx="320" cy="80" r="3" fill="#A78BFA" opacity="0.3"/>
  <circle cx="80" cy="320" r="3" fill="#A78BFA" opacity="0.3"/>
  <circle cx="320" cy="320" r="3" fill="#A78BFA" opacity="0.3"/>

  <!-- Heart shape -->
  <path d="M200 340 
           C140 280, 80 230, 80 170 
           C80 130, 110 100, 140 100 
           C170 100, 190 125, 200 145 
           C210 125, 230 100, 260 100 
           C290 100, 320 130, 320 170 
           C320 230, 260 280, 200 340Z" 
        fill="url(#bg)" opacity="0.15"/>

  <!-- Main paw print -->
  <g filter="url(#shadow)">
    <!-- Main pad -->
    <path d="M200 230 
             C160 230, 140 200, 140 175 
             C140 155, 155 140, 175 140 
             C190 140, 200 150, 200 165 
             C200 150, 210 140, 225 140 
             C245 140, 260 155, 260 175 
             C260 200, 240 230, 200 230Z" 
          fill="url(#paw)"/>

    <!-- Toe pads -->
    <ellipse cx="148" cy="158" rx="18" ry="22" fill="url(#paw)" transform="rotate(-15, 148, 158)"/>
    <ellipse cx="185" cy="132" rx="16" ry="20" fill="url(#paw)" transform="rotate(-5, 185, 132)"/>
    <ellipse cx="215" cy="132" rx="16" ry="20" fill="url(#paw)" transform="rotate(5, 215, 132)"/>
    <ellipse cx="252" cy="158" rx="18" ry="22" fill="url(#paw)" transform="rotate(15, 252, 158)"/>

    <!-- Small toe dots -->
    <circle cx="148" cy="158" r="5" fill="#fff" opacity="0.3"/>
    <circle cx="185" cy="132" r="4" fill="#fff" opacity="0.3"/>
    <circle cx="215" cy="132" r="4" fill="#fff" opacity="0.3"/>
    <circle cx="252" cy="158" r="5" fill="#fff" opacity="0.3"/>
    <circle cx="200" cy="195" r="6" fill="#fff" opacity="0.2"/>
  </g>

  <!-- Text -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6C63FF" letter-spacing="2">
    Cantinho
  </text>
  <text x="200" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#A78BFA" letter-spacing="4" font-weight="600">
    PET
  </text>
</svg>
